name: Android build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Fetch and verify the arm64 exploit binary
        run: |
          curl --fail --location --retry 3 -o app/src/main/assets/timer \
            https://raw.githubusercontent.com/YuKongA/CVE-2026-98260/ad1f4e7f0e38c9e7f8185a404094b9a62c0009f7/timer/timer
          echo 'a6827ae0fe14173c357991959313d7325bd2ed39a67902b12858ecf83e776ea3  app/src/main/assets/timer' | sha256sum -c -
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TimerRoot-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          test -n "$version" && test "$RELEASE_TAG" = "v$version"
      - name: Fetch and verify the arm64 exploit binary
        run: |
          curl --fail --location --retry 3 -o app/src/main/assets/timer \
            https://raw.githubusercontent.com/YuKongA/CVE-2026-98260/ad1f4e7f0e38c9e7f8185a404094b9a62c0009f7/timer/timer
          echo 'a6827ae0fe14173c357991959313d7325bd2ed39a67902b12858ecf83e776ea3  app/src/main/assets/timer' | sha256sum -c -
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "TimerRoot-${RELEASE_TAG}-arm64.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose TimerRoot-*.apk
          sha256sum TimerRoot-*.apk > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" TimerRoot-*.apk SHA256SUMS.txt --title "TimerRoot $RELEASE_TAG" --generate-notes
